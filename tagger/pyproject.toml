[project]
name = "framelog-tagger"
version = "0.1.0"
description = "Pair Frame Log exports with lab scans and write the metadata into the JPEGs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pillow>=10",
    "tzdata>=2024.1",
    "tzlocal>=5",
    # face tagging. InsightFace aligns faces with a scikit-image call deprecated in 0.26 and removed in 2.2.
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.17",
    "insightface>=0.7",
    "scikit-image<2.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
framelog-tagger = "framelog_tagger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["framelog_tagger*"]

[tool.setuptools.package-data]
framelog_tagger = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
