[project]
name = "framelog-tagger"
version = "0.1.0"
description = "Pair Frame Log CSV exports with lab scans and write the metadata into the JPEGs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pillow>=10",
    "tzdata>=2024.1",
    "tzlocal>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
framelog-tagger = "framelog_tagger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["framelog_tagger*"]

[tool.setuptools.package-data]
framelog_tagger = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
