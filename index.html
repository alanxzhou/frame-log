<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16140f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frame Log">
<title>Frame Log</title>
<style>
  :root {
    --body: #16140f;          /* unexposed film base */
    --panel: #1f1c15;
    --panel-edge: #2c2818;
    --rebate: #e8930c;        /* rebate edge-marking amber */
    --rebate-dim: #9c6510;
    --ivory: #ece5d3;
    --muted: #8d8472;
    --danger: #c4452f;
    --ok: #7fae62;
    --mono: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--body);
    color: var(--ivory);
    font-family: var(--sans);
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 14px 40px;
    font-size: 15px;
  }

  /* ---- header styled like a rebate edge marking ---- */
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--rebate-dim);
    padding-bottom: 8px; margin-bottom: 14px;
  }
  header h1 {
    font-family: var(--mono);
    font-size: 17px; letter-spacing: 0.22em;
    color: var(--rebate); text-transform: uppercase; font-weight: 700;
  }
  header .status {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    color: var(--muted); text-transform: uppercase;
  }
  header .status.ok { color: var(--ok); }

  /* ---- roll selector ---- */
  .roll-bar {
    display: flex; gap: 8px; margin-bottom: 16px; align-items: center;
  }
  .roll-bar select {
    flex: 1; min-width: 0; background: var(--panel); color: var(--ivory);
    border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 10px 12px; font-family: var(--mono); font-size: 14px;
    appearance: none; text-overflow: ellipsis;
  }
  .roll-bar button {
    flex: 0 0 auto; white-space: nowrap;
    background: var(--panel); color: var(--rebate);
    border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 10px 12px; font-family: var(--mono); font-size: 13px; cursor: pointer;
  }

  /* ---- shown while the log can't be written to storage ---- */
  .save-warning {
    border: 1px solid var(--danger); border-radius: 6px; color: var(--danger);
    padding: 9px 12px; margin-bottom: 14px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em;
  }

  /* ---- the shutter button: signature element ---- */
  .shutter-wrap { display: flex; flex-direction: column; align-items: center; margin: 6px 0 10px; }
  #shutter {
    width: 148px; height: 148px; border-radius: 50%;
    border: 3px solid var(--rebate-dim);
    background: radial-gradient(circle at 38% 32%, #2b2718, #1a170f 70%);
    color: var(--rebate);
    font-family: var(--mono); font-size: 15px; letter-spacing: 0.18em;
    text-transform: uppercase; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 0 #0c0b07, inset 0 2px 6px rgba(232,147,12,0.12);
    transition: transform 0.06s, box-shadow 0.06s;
    touch-action: manipulation;
  }
  #shutter:active { transform: translateY(5px); box-shadow: 0 1px 0 #0c0b07; }
  #shutter:disabled { color: var(--muted); border-color: var(--panel-edge); }
  #shutter:focus-visible { outline: 3px solid var(--ivory); outline-offset: 3px; }
  .fix-readout {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    margin-top: 10px; letter-spacing: 0.08em; min-height: 16px; text-align: center;
  }
  .fix-readout .good { color: var(--ok); }
  .fix-readout .bad { color: var(--danger); }

  /* ---- collapsible shot details ---- */
  details.shot-meta {
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 8px; margin-bottom: 16px;
  }
  details.shot-meta summary {
    padding: 11px 14px; cursor: pointer; font-family: var(--mono);
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); list-style: none;
  }
  details.shot-meta summary::before { content: "▸ "; color: var(--rebate); }
  details[open].shot-meta summary::before { content: "▾ "; }
  .meta-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 14px;
  }
  .meta-grid label {
    display: flex; flex-direction: column; gap: 4px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .meta-grid input, .meta-grid textarea {
    background: var(--body); border: 1px solid var(--panel-edge);
    border-radius: 5px; color: var(--ivory); padding: 9px 10px;
    font-size: 15px; font-family: var(--sans); width: 100%;
  }
  .meta-grid .full { grid-column: 1 / -1; }
  .meta-grid input:focus, .meta-grid textarea:focus { outline: 2px solid var(--rebate-dim); }

  /* ---- log entries styled as a film strip ---- */
  .strip-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--rebate-dim);
    margin: 4px 0 8px; display: flex; justify-content: space-between;
  }
  #entries { list-style: none; }
  #entries li {
    border-left: 3px solid var(--rebate-dim);
    background: var(--panel);
    margin-bottom: 8px; padding: 10px 12px; border-radius: 0 7px 7px 0;
    position: relative;
  }
  #entries li .frame-no {
    font-family: var(--mono); color: var(--rebate); font-weight: 700;
    font-size: 14px; letter-spacing: 0.1em;
  }
  #entries li .when, #entries li .coords {
    font-family: var(--mono); font-size: 12px; color: var(--ivory);
    display: block; margin-top: 3px;
  }
  #entries li { padding-right: 58px; }
  #entries li .coords { color: var(--muted); }
  #entries li .note { font-size: 13px; color: var(--muted); margin-top: 4px; }
  #entries li .actions {
    position: absolute; top: 6px; right: 6px; display: flex;
  }
  #entries li button.edit, #entries li button.del {
    background: none; border: none; color: var(--muted);
    font-size: 15px; cursor: pointer; padding: 4px 7px;
  }
  #entries li button.edit:hover { color: var(--rebate); }
  #entries li button.del:hover { color: var(--danger); }
  /* ---- drag-to-reorder handle ---- */
  #entries li { padding-left: 36px; }
  #entries li.editing { padding-left: 12px; }
  #entries li button.grip {
    position: absolute; top: 0; bottom: 0; left: 0; width: 34px;
    background: none; border: none; color: var(--muted);
    font-size: 18px; cursor: grab;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #entries li button.grip:disabled { visibility: hidden; }
  #entries li.dragging {
    z-index: 2; background: var(--panel-edge); cursor: grabbing;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
  }
  .empty {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    text-align: center; padding: 24px 10px; letter-spacing: 0.08em;
  }

  /* ---- inline frame edit form ---- */
  .entry-edit {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .entry-edit label {
    display: flex; flex-direction: column; gap: 4px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .entry-edit input, .entry-edit textarea {
    background: var(--body); border: 1px solid var(--panel-edge);
    border-radius: 5px; color: var(--ivory); padding: 9px 10px;
    font-size: 15px; font-family: var(--sans); width: 100%;
  }
  .entry-edit .full { grid-column: 1 / -1; }
  .entry-edit input:focus, .entry-edit textarea:focus { outline: 2px solid var(--rebate-dim); }
  .edit-actions { display: flex; gap: 8px; margin-top: 2px; }
  .edit-actions button {
    flex: 1; padding: 10px; border-radius: 6px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .edit-actions .save { background: var(--rebate-dim); color: var(--body); border: none; font-weight: 700; }
  .edit-actions .cancel { background: none; color: var(--muted); border: 1px solid var(--panel-edge); }

  /* ---- export bar ---- */
  .export-bar { display: flex; gap: 8px; margin-top: 18px; }
  .export-bar button {
    flex: 1; padding: 12px; border-radius: 7px; cursor: pointer;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase;
    background: var(--panel); color: var(--rebate);
    border: 1px solid var(--rebate-dim);
  }
  .export-bar button:active { background: var(--panel-edge); }

  @media (prefers-reduced-motion: reduce) {
    #shutter { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Frame · Log</h1>
  <span class="status" id="gpsStatus">GPS idle</span>
</header>

<div class="roll-bar">
  <select id="rollSelect" aria-label="Current roll"></select>
  <button id="renameRoll" title="Rename current roll" aria-label="Rename current roll">Rename</button>
  <button id="newRoll" title="Start a new roll">+ Roll</button>
  <button id="deleteRoll" title="Delete current roll" aria-label="Delete current roll">✕</button>
</div>

<div class="save-warning" id="saveWarning" role="alert" hidden>
  Couldn't save the log on this phone (storage full or blocked). Frames logged
  now are only in this open page — export now.
</div>

<div class="shutter-wrap">
  <button id="shutter">Log<br>Frame</button>
  <div class="fix-readout" id="fixReadout">press to capture time + position</div>
</div>

<details class="shot-meta">
  <summary>Shot details (optional, applied to next log)</summary>
  <div class="meta-grid">
    <label>Lens <input id="mLens" placeholder="50mm f/1.8"></label>
    <label>Aperture f/<input id="mAperture" type="number" step="any" min="0" placeholder="8" inputmode="decimal"></label>
    <label>Shutter <input id="mShutter" placeholder="1/250"></label>
    <label>Frame # <input id="mFrame" placeholder="auto" inputmode="numeric"></label>
    <label class="full">Notes <textarea id="mNotes" rows="2" placeholder="backlit, metered for shadows…"></textarea></label>
  </div>
</details>

<div class="strip-label">
  <span id="rollTitle">—</span>
  <span id="frameCount">0 frames</span>
</div>
<ul id="entries"></ul>
<div class="empty" id="emptyMsg">— no frames logged on this roll —</div>

<div class="export-bar">
  <button id="exportZip">Export ZIP</button>
  <button id="exportGpx">GPX</button>
  <button id="exportJson">JSON</button>
</div>

<script>
"use strict";

/* ---------- storage ---------- */
const KEY = "frameLogV1";
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* corrupted -> start fresh */ }
  const id = newId();
  return { currentRoll: id, rolls: { [id]: { name: "Roll 1", entries: [] } } };
}
// Never throws: a failed write (quota full, private mode) must not stop the
// caller, e.g. the shutter handler still has a fix to request. The frame is
// then only in memory, so say so until a later save gets through.
function save() {
  let ok = true;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { ok = false; }
  $("saveWarning").hidden = ok;
}
function newId() { return "r" + Date.now().toString(36); }
function roll() { return state.rolls[state.currentRoll]; }

let editingIndex = null; // index (within the current roll) of the entry being edited, or null

/* ---------- elements ---------- */
const $ = (id) => document.getElementById(id);
const shutter = $("shutter"), fixReadout = $("fixReadout"), gpsStatus = $("gpsStatus");

/* ---------- roll management ---------- */
function renderRolls() {
  const sel = $("rollSelect");
  sel.innerHTML = "";
  for (const [id, r] of Object.entries(state.rolls)) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = r.name + " (" + r.entries.length + ")";
    if (id === state.currentRoll) opt.selected = true;
    sel.appendChild(opt);
  }
}
$("rollSelect").addEventListener("change", (e) => {
  state.currentRoll = e.target.value; editingIndex = null; save(); renderEntries();
});
$("renameRoll").addEventListener("click", () => {
  const r = roll();
  const name = prompt("Rename roll:", r.name);
  if (name === null) return;          // cancelled
  const trimmed = name.trim();
  if (!trimmed) return;               // refuse blank names
  r.name = trimmed;
  save(); renderRolls(); renderEntries();
});
$("newRoll").addEventListener("click", () => {
  const name = prompt("Roll name (e.g. 2026-06 Portra 400 #3):",
                      "Roll " + (Object.keys(state.rolls).length + 1));
  if (name === null) return;          // cancelled
  const trimmed = name.trim();
  if (!trimmed) return;               // refuse blank names
  const id = newId();
  state.rolls[id] = { name: trimmed, entries: [] };
  state.currentRoll = id;
  editingIndex = null;
  save(); renderRolls(); renderEntries();
});
$("deleteRoll").addEventListener("click", () => {
  const r = roll();
  if (!confirm('Delete roll "' + r.name + '" and its ' + frameCountText(r.entries.length) +
               "? This can't be undone.")) return;
  // A fix still pending for one of its frames is dropped by applyFix (rollOf finds no roll).
  delete state.rolls[state.currentRoll];
  const ids = Object.keys(state.rolls);
  if (ids.length) {
    state.currentRoll = ids[ids.length - 1];
  } else {                            // always keep a current roll to log into
    const id = newId();
    state.rolls[id] = { name: "Roll 1", entries: [] };
    state.currentRoll = id;
  }
  editingIndex = null;
  save(); renderRolls(); renderEntries();
});

/* ---------- the core: log a frame ---------- */
// The frame is saved at the press and the fix is filled in when it lands, so a
// page suspended mid-fix (phone pocketed) still keeps the frame. Pending
// entries are tracked by object: nothing replaces entry objects (edits mutate,
// drag reorders the same objects), so a reference survives reorders and roll
// switches, and a deleted entry simply isn't found again.
const awaitingFix = new WeakSet();
let fixesPending = 0;

function pendingNote() {
  return fixesPending ? " · " + fixesPending + " fix" + (fixesPending === 1 ? "" : "es") + " pending" : "";
}
function showGpsStatus(text, ok) {
  gpsStatus.textContent = fixesPending ? "GPS acquiring…" : text;
  gpsStatus.classList.toggle("ok", !fixesPending && ok);
}

shutter.addEventListener("click", () => {
  const entry = addEntry(new Date()); // the moment of the press, not the fix
  if (!navigator.geolocation) {
    showGpsStatus("GPS unavailable", false);
    fixReadout.innerHTML = '<span class="bad">frame ' + entry.frame +
      " · no GPS on this device — time logged, coords blank</span>";
    return;
  }
  awaitingFix.add(entry);
  fixesPending++;
  showGpsStatus("", false);
  fixReadout.textContent = "frame " + entry.frame + " logged · acquiring fix…" +
    (fixesPending > 1 ? pendingNote() : "");
  refreshCoords(entry); // "no coordinates" -> "acquiring fix…" on the new row

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      fixesPending--;
      awaitingFix.delete(entry);
      const applied = applyFix(entry, pos.coords);
      showGpsStatus("GPS fixed", true);
      const acc = Math.round(pos.coords.accuracy);
      fixReadout.innerHTML = "frame " + entry.frame + " · " +
        (applied
          ? 'accuracy <span class="' + (acc <= 15 ? "good" : "bad") + '">±' + acc + " m</span>"
          : "fix not applied (frame deleted or coords entered by hand)") + pendingNote();
    },
    (err) => {
      fixesPending--;
      awaitingFix.delete(entry);
      refreshCoords(entry); // "acquiring fix…" -> "no coordinates"
      showGpsStatus("GPS failed", false);
      fixReadout.innerHTML = '<span class="bad">frame ' + entry.frame + ": no fix (" + escapeHtml(err.message || "error") +
        ") — time logged, coords blank</span>" + pendingNote();
    },
    { enableHighAccuracy: true, timeout: 30000, maximumAge: 5000 }
  );
});

function rollOf(entry) {
  return Object.values(state.rolls).find((r) => r.entries.includes(entry)) || null;
}

// Fill in a late fix. Returns false when it was dropped: the entry was deleted,
// or the user has typed coordinates into it (saved, or still in an open form).
function applyFix(entry, coords) {
  const r = rollOf(entry);
  if (!r || entry.lat != null) return false;
  const form = editFormOf(entry);
  if (form) {
    const lat = form.querySelector(".eLat"), lon = form.querySelector(".eLon");
    if (lat.value.trim() || lon.value.trim()) return false;
    // Put the fix into the open form rather than re-rendering it, which would
    // drop unsaved edits; Save then keeps it.
    lat.value = coords.latitude; lon.value = coords.longitude;
  }
  entry.lat = coords.latitude;
  entry.lon = coords.longitude;
  entry.acc = Math.round(coords.accuracy);
  entry.alt = coords.altitude != null ? Math.round(coords.altitude) : null;
  save();
  refreshCoords(entry);
  return true;
}

// The <li> showing entry, if it's on screen. Looked up by index rather than
// re-rendering, so an open edit form or a drag in progress is left alone.
function rowOf(entry) {
  const r = roll();
  const idx = r.entries.indexOf(entry);
  return idx < 0 ? null : $("entries").querySelector('li[data-idx="' + idx + '"]');
}
function editFormOf(entry) {
  const li = rowOf(entry);
  return li && li.classList.contains("editing") ? li : null;
}
function refreshCoords(entry) {
  const li = rowOf(entry);
  const span = li && li.querySelector(".coords");
  if (span) span.textContent = coordsText(entry);
}

function deviceZone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; }
}

function nextFrameDefault(r) {
  // Increment from the highest frame number logged, not the entry count or
  // the last entry, so a manually-set start (e.g. a roll beginning at 6)
  // carries forward and a backfilled frame doesn't pull the default back.
  return r.entries.length ? Math.max(...r.entries.map((e) => e.frame)) + 1 : 1;
}

function formatAperture(raw) {
  const trimmed = String(raw).trim();
  return trimmed ? "f/" + trimmed : "";
}
function apertureNumber(aperture) {
  const m = /^f\/(.+)$/.exec(aperture || "");
  return m ? m[1] : "";
}

// Saves a new entry without coordinates; the shutter handler fills them in later.
function addEntry(when) {
  const r = roll();
  // A typo'd frame # would store NaN, which exports as null and makes the tagger reject the roll.
  const manualFrame = parseInt($("mFrame").value.trim(), 10);
  const entry = {
    frame: Number.isFinite(manualFrame) ? manualFrame : nextFrameDefault(r),
    iso: when.toISOString(),
    local: when.toLocaleString(),
    tz: deviceZone(), // IANA zone the phone was in; lets the tagger write correct local times on travel rolls
    lat: null,
    lon: null,
    acc: null,
    alt: null,
    lens: $("mLens").value.trim(),
    aperture: formatAperture($("mAperture").value),
    shutterSpeed: $("mShutter").value.trim(),
    notes: $("mNotes").value.trim()
  };
  r.entries.push(entry);
  $("mFrame").value = ""; $("mNotes").value = ""; // sticky: lens/aperture/shutter persist
  save(); renderRolls();
  // An open edit form would lose its unsaved changes to a re-render; the new
  // row shows up when that form is saved or cancelled.
  if (editingIndex === null) renderEntries();
  else $("frameCount").textContent = frameCountText(r.entries.length);
  return entry;
}

function coordsText(en) {
  if (en.lat != null) return en.lat.toFixed(6) + ", " + en.lon.toFixed(6) + (en.acc != null ? " · ±" + en.acc + "m" : "");
  return awaitingFix.has(en) ? "acquiring fix…" : "no coordinates";
}

/* ---------- render entries ---------- */
function frameCountText(n) { return n + " frame" + (n === 1 ? "" : "s"); }

function renderEntries() {
  const r = roll();
  $("rollTitle").textContent = r.name;
  $("frameCount").textContent = frameCountText(r.entries.length);
  $("mFrame").placeholder = "auto (" + nextFrameDefault(r) + ")";
  const ul = $("entries");
  ul.innerHTML = "";
  $("emptyMsg").style.display = r.entries.length ? "none" : "block";
  [...r.entries].reverse().forEach((en, revIdx) => {
    const idx = r.entries.length - 1 - revIdx;
    const li = document.createElement("li");
    li.dataset.idx = idx;
    if (idx === editingIndex) {
      li.classList.add("editing");
      li.innerHTML = editFormHtml(en);
      wireEditForm(li, r, idx);
    } else {
      const gear = [en.lens, en.aperture, en.shutterSpeed].filter(Boolean).join(" · ");
      li.innerHTML =
        '<button class="grip" aria-label="Drag to reorder">≡</button>' +
        '<span class="frame-no">' + en.frame + '</span>' +
        '<span class="when">' + en.local + "</span>" +
        '<span class="coords">' + coordsText(en) + "</span>" +
        (gear ? '<div class="note">' + escapeHtml(gear) + "</div>" : "") +
        (en.notes ? '<div class="note">' + escapeHtml(en.notes) + "</div>" : "") +
        '<div class="actions">' +
          '<button class="edit" aria-label="Edit frame">✎</button>' +
          '<button class="del" aria-label="Delete frame">✕</button>' +
        "</div>";
      const grip = li.querySelector(".grip");
      // Hidden while a frame is open for editing: a re-render would drop its unsaved changes.
      grip.disabled = editingIndex !== null || r.entries.length < 2;
      wireDrag(grip, li, r);
      li.querySelector(".edit").addEventListener("click", () => {
        editingIndex = idx; renderEntries();
      });
      li.querySelector(".del").addEventListener("click", () => {
        if (confirm("Delete frame " + en.frame + "?")) {
          r.entries.splice(idx, 1); editingIndex = null; save(); renderRolls(); renderEntries();
        }
      });
    }
    ul.appendChild(li);
  });
}

/* ---------- drag to reorder ---------- */
// Hand-rolled on pointer events: HTML5 drag-and-drop is unreliable on touch
// (iOS Safari especially). Only the order changes; frame numbers stay as entered.
const EDGE_SCROLL = 60; // px from the viewport edge where a drag auto-scrolls the page

function midY(el) {
  const b = el.getBoundingClientRect();
  return b.top + b.height / 2;
}

function wireDrag(grip, li, r) {
  grip.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    const ul = li.parentNode;
    const grabOffset = e.clientY - li.getBoundingClientRect().top;
    let pointerY = e.clientY;
    let rafId = 0;
    li.classList.add("dragging");

    function place() {
      // Move the neighbours across the dragged item rather than the item
      // itself (detaching it would drop the pointer capture), then pin it
      // under the finger.
      let prev, next;
      while ((prev = li.previousElementSibling) && pointerY < midY(prev)) ul.insertBefore(prev, li.nextSibling);
      while ((next = li.nextElementSibling) && pointerY > midY(next)) ul.insertBefore(next, li);
      li.style.transform = "";
      const natural = li.getBoundingClientRect().top;
      li.style.transform = "translateY(" + (pointerY - grabOffset - natural) + "px)";
    }
    function autoScroll() {
      const dy = pointerY < EDGE_SCROLL ? -8 : pointerY > innerHeight - EDGE_SCROLL ? 8 : 0;
      if (dy) { window.scrollBy(0, dy); place(); }
      rafId = requestAnimationFrame(autoScroll);
    }
    function onMove(ev) { pointerY = ev.clientY; place(); }
    function finish(ev) {
      cancelAnimationFrame(rafId);
      grip.removeEventListener("pointermove", onMove);
      grip.removeEventListener("pointerup", finish);
      grip.removeEventListener("pointercancel", finish);
      if (ev.type === "pointerup") {
        // The list is drawn newest-first; entries are stored oldest-first.
        const order = [...ul.children].reverse().map((el) => r.entries[el.dataset.idx]);
        if (order.some((en, i) => en !== r.entries[i])) { r.entries = order; save(); }
      }
      renderEntries(); // pointercancel lands here too and snaps back to the saved order
    }
    grip.addEventListener("pointermove", onMove);
    grip.addEventListener("pointerup", finish);
    grip.addEventListener("pointercancel", finish);
    rafId = requestAnimationFrame(autoScroll);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- inline frame editing ---------- */
function toLocalInputValue(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
    "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

function editFormHtml(en) {
  return (
    '<div class="entry-edit">' +
      '<label>Frame # <input type="number" class="eFrame" value="' + en.frame + '"></label>' +
      '<label>Time <input type="datetime-local" step="1" class="eTime" value="' + toLocalInputValue(en.iso) + '"></label>' +
      '<label>Latitude <input type="number" step="any" class="eLat" value="' + (en.lat != null ? en.lat : "") + '" placeholder="blank = none"></label>' +
      '<label>Longitude <input type="number" step="any" class="eLon" value="' + (en.lon != null ? en.lon : "") + '" placeholder="blank = none"></label>' +
      '<label>Lens <input class="eLens" value="' + escapeHtml(en.lens) + '"></label>' +
      '<label>Aperture f/<input type="number" step="any" min="0" class="eAperture" value="' + escapeHtml(apertureNumber(en.aperture)) + '"></label>' +
      '<label>Shutter <input class="eShutter" value="' + escapeHtml(en.shutterSpeed) + '"></label>' +
      '<label class="full">Notes <textarea class="eNotes" rows="2">' + escapeHtml(en.notes) + "</textarea></label>" +
      '<div class="full edit-actions">' +
        '<button class="save">Save</button>' +
        '<button class="cancel">Cancel</button>' +
      "</div>" +
    "</div>"
  );
}

function wireEditForm(li, r, idx) {
  li.querySelector(".cancel").addEventListener("click", () => {
    editingIndex = null; renderEntries();
  });
  li.querySelector(".save").addEventListener("click", () => {
    const en = r.entries[idx];
    const frameVal = parseInt(li.querySelector(".eFrame").value, 10);
    const timeVal = li.querySelector(".eTime").value;
    const latRaw = li.querySelector(".eLat").value.trim();
    const lonRaw = li.querySelector(".eLon").value.trim();
    const lat = latRaw === "" ? null : parseFloat(latRaw);
    const lon = lonRaw === "" ? null : parseFloat(lonRaw);

    if (!Number.isFinite(frameVal)) { alert("Frame # must be a number."); return; }
    if (!timeVal) { alert("Time is required."); return; }
    if ((lat === null) !== (lon === null)) {
      alert("Enter both latitude and longitude, or leave both blank."); return;
    }
    if (lat !== null && (!Number.isFinite(lat) || !Number.isFinite(lon))) {
      alert("Latitude/longitude must be numbers."); return;
    }
    if (lat !== null && (Math.abs(lat) > 90 || Math.abs(lon) > 180)) {
      alert("Latitude must be between -90 and 90, longitude between -180 and 180."); return;
    }
    const d = new Date(timeVal);
    if (isNaN(d.getTime())) { alert("Invalid time."); return; }

    en.frame = frameVal;
    en.iso = d.toISOString();
    en.local = d.toLocaleString();
    en.lat = lat;
    en.lon = lon;
    if (lat === null) { en.acc = null; en.alt = null; } // manual clear: old fix no longer applies
    en.lens = li.querySelector(".eLens").value.trim();
    en.aperture = formatAperture(li.querySelector(".eAperture").value);
    en.shutterSpeed = li.querySelector(".eShutter").value.trim();
    en.notes = li.querySelector(".eNotes").value.trim();

    editingIndex = null;
    save(); renderRolls(); renderEntries();
  });
}

/* ---------- exports ---------- */
function downloadBlob(filename, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function download(filename, mime, text) {
  downloadBlob(filename, new Blob([text], { type: mime }));
}
function slug(s) { return s.replace(/[^a-z0-9]+/gi, "_").toLowerCase(); }

function buildGpx(r) {
  const wpts = r.entries.filter((e) => e.lat != null).map((e) => {
    const name = "Frame " + e.frame;
    const desc = [e.lens, e.aperture, e.shutterSpeed, e.notes].filter(Boolean).join(" | ");
    return '  <wpt lat="' + e.lat + '" lon="' + e.lon + '">\n' +
           (e.alt != null ? "    <ele>" + e.alt + "</ele>\n" : "") + // GPX 1.1 order: ele, time, name, desc
           "    <time>" + e.iso + "</time>\n" +
           "    <name>" + escapeHtml(name) + "</name>\n" +
           (desc ? "    <desc>" + escapeHtml(desc) + "</desc>\n" : "") +
           "  </wpt>";
  }).join("\n");
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<gpx version="1.1" creator="FrameLog" xmlns="http://www.topografix.com/GPX/1/1">\n' +
    "  <metadata><name>" + escapeHtml(r.name) + "</name></metadata>\n" +
    wpts + "\n</gpx>\n";
}

function buildJson(r) {
  // The contract with tagger/framelog_tagger/log.py: entries are written
  // exactly as stored, so a field added here shows up there untouched.
  return JSON.stringify({
    app: "framelog",
    schema: 2, // 2: entries may carry tz (IANA zone at log time)
    exported: new Date().toISOString(),
    roll: r.name,
    entries: r.entries
  }, null, 2) + "\n";
}

$("exportGpx").addEventListener("click", () => {
  const r = roll();
  download(slug(r.name) + ".gpx", "application/gpx+xml", buildGpx(r));
});

$("exportJson").addEventListener("click", () => {
  const r = roll();
  download(slug(r.name) + ".json", "application/json", buildJson(r));
});

$("exportZip").addEventListener("click", () => {
  const r = roll();
  const base = slug(r.name);
  const zip = makeZip([
    { name: base + ".gpx", data: buildGpx(r) },
    { name: base + ".json", data: buildJson(r) }
  ]);
  downloadBlob(base + ".zip", zip);
});

/* ---------- minimal ZIP writer (store method, no compression, no deps) ---------- */
function crc32(bytes) {
  let c, crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    c = (crc ^ bytes[i]) & 0xFF;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function dosDateTime(d) {
  const time = ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | ((d.getSeconds() >> 1) & 0x1F);
  const date = (((d.getFullYear() - 1980) & 0x7F) << 9) | (((d.getMonth() + 1) & 0xF) << 5) | (d.getDate() & 0x1F);
  return { time, date };
}

function makeZip(files) {
  const encoder = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  const { time, date } = dosDateTime(new Date());

  for (const f of files) {
    const nameBytes = encoder.encode(f.name);
    const dataBytes = encoder.encode(f.data);
    const crc = crc32(dataBytes);
    const size = dataBytes.length;

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, time, true);
    lv.setUint16(12, date, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    parts.push(local, dataBytes);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, time, true);
    cv.setUint16(14, date, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += local.length + dataBytes.length;
  }

  const centralSize = central.reduce((s, c) => s + c.length, 0);
  const centralOffset = offset;
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralOffset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...parts, ...central, end], { type: "application/zip" });
}

/* ---------- init ---------- */
renderRolls();
renderEntries();
// Ask the browser not to evict the log (iOS can clear web-app storage); best effort.
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- PWA: register service worker for offline use ---------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch((e) =>
    console.warn("Service worker registration failed:", e));
}
</script>
