[project]
name = "framelog-sync"
version = "0.1.0"
description = "Serve the Frame Log PWA, receive the phone's log over /api/sync, keep snapshots and back them up to S3."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
framelog-sync = "framelog_sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["framelog_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
